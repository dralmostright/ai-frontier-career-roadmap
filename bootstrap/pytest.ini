# Pytest configuration lives here, not in environment/pyproject.toml, so that
# pytest's rootdir is `bootstrap/`. That matters: pytest only honors
# `pytest_addoption` from a conftest.py at the rootdir, and the `--week` option
# that gates tests by course week is defined in bootstrap/conftest.py.
#
# ruff, mypy, and project metadata stay in environment/pyproject.toml.

[pytest]
minversion = 8.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short

markers =
    week(n): the course week this test belongs to; skipped until CURRENT_WEEK >= n
    slow: takes more than 5 seconds
    gpu: requires a GPU
    network: requires network access
    db: requires the docker-compose Postgres to be running
    llm: requires an LLM API key

norecursedirs = .venv .git __pycache__ *.egg-info node_modules data artifacts
